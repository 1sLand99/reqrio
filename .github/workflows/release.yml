name: release

# 每次运行在 Actions 列表里显示为「release v<版本号>」，便于区分不同版本的发布
run-name: release v${{ inputs.version }}

# 手动触发：输入目标版本号，自动修改所有相关文件的版本号，
# 提交一个 release commit
# 提交 release: bump version X.Y.Z,推送
on:
  workflow_dispatch:
    inputs:
      version:
        description: "目标版本号（不含 v 前缀），例如 0.3.0 或 0.3.0-alpha3"
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  # ----------------------------------------------------------------------------
  # 发布前检查：Linux + Windows 上跑测试与 FFI 测试，任一失败则中止整个发布流程
  # ----------------------------------------------------------------------------
  prerelease-check:
    name: prerelease-check (${{ matrix.os }})
    strategy:
      fail-fast: true
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    env:
      TOKEN: ${{ secrets.TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          key: |
            ${{ runner.os }}-cargo-${{ github.ref }}-${{ hashFiles('**/Cargo.lock') }}
            ${{ runner.os }}-cargo-${{ github.ref }}-
            ${{ runner.os }}-cargo-
          cache-on-failure: true
          prefix-key: |
            ${{ runner.os }}-cargo-

      - name: cargo test
        run: |
          cargo test --features aync,serde --release

      - name: cargo build (export cdylib)
        run: cargo build --package reqrio --release --features export

      - name: Copy native lib (Linux)
        if: runner.os == 'Linux'
        run: cp target/release/libreqrio.so reqrio-py/reqrio/

      - name: Copy native lib (Windows)
        if: runner.os == 'Windows'
        run: copy target\release\reqrio.dll reqrio-py\reqrio\

      - name: Set PYTHONPATH (Linux)
        if: runner.os == 'Linux'
        run: echo "PYTHONPATH=${{ github.workspace }}/reqrio-py" >> $GITHUB_ENV

      - name: Set PYTHONPATH (Windows)
        if: runner.os == 'Windows'
        run: echo "PYTHONPATH=${{ github.workspace }}\reqrio-py" >> $env:GITHUB_ENV

      - name: Run Python FFI test
        run: |
          python reqrio-py/tests/test_session.py
          python reqrio-py/tests/test_cipher.py

  # ----------------------------------------------------------------------------
  # 版本号 bump：改好所有文件版本号后提交到「临时分支」ci/release-<version>，
  # 不直接推主分支；下游全部基于该临时分支构建/发布，
  # 待所有任务成功后由 finalize 合并回主分支并打 tag
  # ----------------------------------------------------------------------------
  bump-version:
    needs: prerelease-check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Validate version format
        run: |
          if ! echo "${{ inputs.version }}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)[0-9]*)?$'; then
            echo "非法版本号: ${{ inputs.version }}" >&2
            exit 1
          fi

      - name: Bump version in all packages
        env:
          NEW: ${{ inputs.version }}
        run: |
          set -euo pipefail

          # Rust: reqrio / reqtls 包版本（行首 version）
          sed -i -E 's/^version = "[^"]*"/version = "'"$NEW"'"/' reqrio/Cargo.toml
          sed -i -E 's/^version = "[^"]*"/version = "'"$NEW"'"/' reqtls/Cargo.toml

          # Rust: 工作区对 reqtls 的依赖引用
          sed -i -E 's/(reqtls = \{ path = "reqtls", version = ")[^"]*(")/\1'"$NEW"'\2/' Cargo.toml

          # Python
          sed -i -E 's/^version = "[^"]*"/version = "'"$NEW"'"/' reqrio-py/pyproject.toml
          sed -i -E 's/(version=")[^"]*(")/\1'"$NEW"'\2/' reqrio-py/setup.py

          # Java（仅项目 version，4 空格缩进，避免误伤依赖/插件版本）
          sed -i -E 's#^    <version>[^<]*</version>#    <version>'"$NEW"'</version>#' reqrio-java/pom.xml

          # Node.js
          sed -i -E 's/("version": ")[^"]*(")/\1'"$NEW"'\2/' reqrio-js/package.json

      - name: Show diff
        run: git --no-pager diff

      - name: Commit to temp release branch
        env:
          NEW: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reqrio/Cargo.toml reqtls/Cargo.toml Cargo.toml \
                  reqrio-py/pyproject.toml reqrio-py/setup.py \
                  reqrio-java/pom.xml reqrio-js/package.json
          git commit -m "bump version ${NEW}"
          # 推到临时分支（不碰主分支）；-f 让本版本号可重跑覆盖
          git push -f origin "HEAD:refs/heads/ci/release-${NEW}"
  # ----------------------------------------------------------------------------
  # 构建跨平台原生库（.so / .dll），上传为 artifact 供各语言发布任务复用
  # ----------------------------------------------------------------------------
  build-natives:
    name: build-natives (${{ matrix.target.os }})
    needs: bump-version
    strategy:
      matrix:
        target:
          - { os: ubuntu-latest,  artifact: linux,   file: libreqrio.so }
          - { os: windows-latest, artifact: windows, file: reqrio.dll }
    runs-on: ${{ matrix.target.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/release-${{ inputs.version }}
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: |
            ${{ runner.os }}-cargo-

      - name: cargo build (export cdylib)
        run: cargo build --package reqrio --release --features export

      - name: Upload native lib
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target.artifact }}
          path: |
            target/release/${{ matrix.target.file }}
            target/release/*.lib
          if-no-files-found: error

  # ----------------------------------------------------------------------------
  # go 构建验证：交叉编译 windows-gnu 目标，确保可链接通过
  # （go module tag 改到 finalize，待所有任务成功后再打）
  # ----------------------------------------------------------------------------
  release-go:
    name: release-go (windows-gnu build)
    needs: bump-version
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/release-${{ inputs.version }}
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: |
            windows-2022-cargo-
      - name: build windows-gnu
        # build.rs 对 windows-gnu 用 dylib 链接 stdc++，但 bds.cpp 的
        # std::filesystem / codecvt 符号只在静态 libstdc++.a 里、DLL 不导出，
        # 这里追加静态 stdc++（排在最后，解析 rlib 里残留的 codecvt 引用）
        env:
          RUSTFLAGS: "-Clink-arg=-Wl,-Bstatic -Clink-arg=-lstdc++ -Clink-arg=-Wl,-Bdynamic"
        run: |
          cargo build --package reqrio --release --features export --target x86_64-pc-windows-gnu

  # ----------------------------------------------------------------------------
  # GitHub Release：聚合原生库并创建 Release
  # ----------------------------------------------------------------------------
  github-release:
    name: github-release
    needs: build-natives
    runs-on: ubuntu-latest
    # 预发行版本（alpha/beta/rc）不创建 GitHub Release，仅发布到各语言仓库
    if: >-
      !contains(inputs.version, 'alpha')
      && !contains(inputs.version, 'beta')
      && !contains(inputs.version, 'rc')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/release-${{ inputs.version }}
      - name: Extract release notes from CHANGELOG.md
        run: |
          VERSION="${{inputs.version}}"
          awk -v ver="reqrio-v${VERSION}" '
            $0 == "# " ver { capture = 1; next }
            capture && /^# reqrio-v/ { exit }
            capture { print }
          ' CHANGELOG.md > RELEASE_NOTES.txt
          if [ ! -s RELEASE_NOTES.txt ]; then
            echo "未在 CHANGELOG.md 中找到版本 ${VERSION} 的说明" >&2
            exit 1
          fi
      - name: Download native libs
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: natives
          merge-multiple: true

      - name: Place native libs into packages
        run: |
          set -e
          mkdir -p natives || true
          if [ -f natives/libreqrio.so ]; then
            cp natives/libreqrio.so reqrio-py/reqrio/ || true
            cp natives/libreqrio.so reqrio-java/src/main/resources/ || true
            cp natives/libreqrio.so reqrio-js/ || true
            cp natives/libreqrio.so reqrio-qt/ || true
            cp natives/libreqrio.so reqrio-go/ || true
          fi
          if [ -f natives/reqrio.dll ]; then
            cp natives/reqrio.dll reqrio-py/reqrio/ || true
            cp natives/reqrio.dll reqrio-java/src/main/resources/ || true
            cp natives/reqrio.dll reqrio-js/ || true
            cp natives/reqrio.dll reqrio-qt/ || true
            cp natives/reqrio.dll reqrio-go/ || true
          fi
          if ls natives/*.lib 1> /dev/null 2>&1; then
            cp natives/reqrio.dll.lib reqrio-qt/reqrio.lib || true
          fi
      - name: Package bindings into zips
        run: |
          mkdir -p dist
          zip -r dist/py.zip   reqrio-py
          zip -r dist/go.zip   reqrio-go
          zip -r dist/js.zip   reqrio-js
          zip -r dist/java.zip reqrio-java
          zip -r dist/qt.zip   reqrio-qt
      - name: Determine version and create tag if not pre-release
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "v${VERSION}" || true
          git push origin "v${VERSION}"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          body_path: RELEASE_NOTES.txt
          files: |
            dist/py.zip
            dist/go.zip
            dist/js.zip
            dist/java.zip
            dist/qt.zip

  # ----------------------------------------------------------------------------
  # Rust → crates.io
  # ----------------------------------------------------------------------------
  publish-crate:
    name: publish-crate (crates.io)
    needs: bump-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/release-${{ inputs.version }}
      - uses: Swatinem/rust-cache@v2
      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo publish --package reqtls
          cargo publish --package reqrio

  # ----------------------------------------------------------------------------
  # Python → PyPI（打包同时携带 .so 与 .dll）
  # ----------------------------------------------------------------------------
  publish-pypi:
    name: publish-pypi (PyPI)
    needs: build-natives
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/release-${{ inputs.version }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download native libs
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: natives
          merge-multiple: true

      - name: Place native libs into package
        run: |
          cp natives/libreqrio.so reqrio-py/reqrio/
          cp natives/reqrio.dll   reqrio-py/reqrio/

      - name: Build wheel & sdist
        working-directory: reqrio-py
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: reqrio-py/dist
          password: ${{ secrets.PYPI_API_TOKEN }}

  # ----------------------------------------------------------------------------
  # Java → Maven Central（central-publishing-maven-plugin + gpg）
  # ----------------------------------------------------------------------------
  publish-maven:
    name: publish-maven (Maven Central)
    needs: build-natives
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/release-${{ inputs.version }}
      - name: Setup JDK + Maven settings
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Download native libs
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: natives
          merge-multiple: true

      - name: Place native libs into resources
        run: |
          cp natives/libreqrio.so reqrio-java/src/main/resources/
          cp natives/reqrio.dll   reqrio-java/src/main/resources/

      - name: Deploy to Maven Central
        working-directory: reqrio-java
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: mvn --batch-mode clean deploy

  # ----------------------------------------------------------------------------
  # Node.js → npm（打包同时携带 .so 与 .dll）
  # ----------------------------------------------------------------------------
  publish-npm:
    name: publish-npm (npm)
    needs: build-natives
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/release-${{ inputs.version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Download native libs
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: natives
          merge-multiple: true

      - name: Place native libs into package
        run: |
          cp natives/libreqrio.so reqrio-js/
          cp natives/reqrio.dll   reqrio-js/

      - name: Publish to npm
        working-directory: reqrio-js
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

  # ----------------------------------------------------------------------------
  # 收尾：所有任务成功后，才把版本提交合并回主分支并推送 go module tag，
  # 最后清理临时分支
  # ----------------------------------------------------------------------------
  finalize:
    name: finalize
    needs:
      - build-natives
      - release-go
      - github-release
      - publish-crate
      - publish-pypi
      - publish-maven
      - publish-npm
    # 任一任务失败或被取消则不提交；github-release 在预发行时被 skip 不算失败
    if: ${{ always() && !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/release-${{ inputs.version }}
          fetch-depth: 0
      - name: Push bump commit to ${{ github.ref_name }} and tag go module
        env:
          NEW: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 把临时分支上的版本提交推到主分支
          git push origin "HEAD:${{ github.ref_name }}"
          # 打并推送 go module tag（指向同一个提交）
          git tag "reqrio-go/v${NEW}"
          git push origin "reqrio-go/v${NEW}"
      - name: Delete temp release branch
        env:
          NEW: ${{ inputs.version }}
        run: git push origin --delete "ci/release-${NEW}"
