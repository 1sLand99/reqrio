[workspace]
resolver = "1"
members = [
    "reqrio"
]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
reqrio-json = { path = "json", version = "0.1.12" }
reqtls = { path = "reqtls", version = "0.3.0-beta1" }

[profile.release]
opt-level = 3
strip = true
lto = "thin"
codegen-units = 1
#panic = "abort"
incremental = false